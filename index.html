<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Product Discovery Engine</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-400">AI Visual Search Engine</h1>
            <p class="text-slate-400 text-sm">Upload an image to trigger the browser-based neural network classifier.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 h-fit shadow-xl">
                <h2 class="text-base font-bold mb-4 text-slate-200">Query Input</h2>
                <div onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-slate-600 rounded-lg p-6 text-center cursor-pointer hover:border-blue-500 hover:bg-slate-700/20 transition duration-200">
                    <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="processImage(event)">
                    <p class="text-sm font-medium">Click to upload image file</p>
                </div>
                <div id="previewContainer" class="hidden mt-4 pt-4 border-t border-slate-700">
                    <img id="uploadPreview" class="w-full max-h-48 object-cover rounded-lg border border-slate-600 shadow-md">
                </div>
            </div>

            <div class="md:col-span-2">
                <div id="loadingState" class="hidden h-48 border border-dashed border-slate-800 rounded-xl flex flex-col items-center justify-center text-slate-500 text-sm">
                    <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-500 mb-2"></div>
                    <p>Neural model analyzing pixel vectors...</p>
                </div>
                <div id="resultsSection" class="hidden">
                    <h2 class="text-lg font-bold mb-4 text-slate-200">Model Predictions</h2>
                    <div id="resultsGrid" class="space-y-4"></div>
                </div>
                <div id="emptyState" class="h-48 border border-dashed border-slate-800 rounded-xl flex items-center justify-center text-slate-500 text-sm text-center px-4">
                    Select an item on the left panel to see AI inference live.
                </div>
            </div>
        </div>
    </div>

    <script>
        let model = null;
        async function loadModel() {
            model = await mobilenet.load();
        }
        loadModel();

        async function processImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const preview = document.getElementById('uploadPreview');
            preview.src = URL.createObjectURL(file);
            document.getElementById('previewContainer').classList.remove('hidden');
            
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('resultsSection').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');

            preview.onload = async () => {
                if (!model) {
                    alert("AI model is still loading. Wait 5 seconds and click upload again.");
                    return;
                }
                const predictions = await model.classify(preview);
                const grid = document.getElementById('resultsGrid');
                grid.innerHTML = '';
                
                predictions.forEach(pred => {
                    const accuracy = (pred.probability * 100).toFixed(2);
                    const row = document.createElement('div');
                    row.className = 'bg-slate-800 border border-slate-700 p-4 flex justify-between items-center rounded-xl shadow';
                    row.innerHTML = `
                        <div>
                            <h3 class="font-bold text-slate-100 capitalize">${pred.className.split(',')[0]}</h3>
                        </div>
                        <span class="font-mono text-teal-400 font-bold bg-teal-950/40 px-3 py-1 rounded-md border border-teal-800 text-sm">${accuracy}% Match</span>
                    `;
                    grid.appendChild(row);
                });

                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('resultsSection').classList.remove('hidden');
            };
        }
    </script>
</body>
</html>
